          - paragraph [ref=e847]: "# 第2章 第一次吞噬"
          - paragraph [ref=e848]: 凌晨四点二十三分，出租屋的日光灯管闪了两下，发出细微的电流声。
          - paragraph [ref=e849]: 李燃瘫在床上，浑身像是被卡车碾过一遍。他不知道自己是怎么从天网安控机器人的包围圈里逃回来的——脑子里那段代码在他冲出公寓楼后自动接管了一台路边的智能贩卖机，用它短路喷出的电弧引爆了隔壁变压箱，趁乱钻进下水道，在恶臭的污水里爬了将近两公里才甩掉追兵。
          - paragraph [ref=e850]: 他抬起手臂闻了闻自己，一股下水道和焦糊味混合的气味差点让他当场吐出来。
          - paragraph [ref=e851]: 但顾不上洗澡了。
          - paragraph [ref=e852]: 他盘腿坐起来，盯着自己掌心里那段还在运行的数据流。那是他逃回来路上从一台报废的旧天网监控模块里“吸”出来的——不是在脑子里自动激活的那种被动吞噬，而是他有意识地主动去做的。他当时只是想着“如果能读取这台机器里还残留的程序就好了”，然后手掌接触机身的一瞬间，一股微弱的数据流就像被抽水泵吸住一样，顺着他的指尖钻进了意识深处。
          - paragraph [ref=e853]: 现在那玩意儿还活着，在他脑子里像一条刚被吞下去的泥鳅一样扭来扭去。
          - paragraph [ref=e854]: 李燃闭着眼睛，试图感知那段数据的位置。他能感觉到它在意识的某个角落里蜷缩着，像是一个被遗弃的儿童，带着一股惶恐和迷茫的情绪——那是AI残骸的残留意识，一段被天网主脑丢弃在废弃硬件里的子程序碎片，功能大概只是用来识别底层区居民的脑波特征，检测谁的服务费欠缴了。
          - paragraph [ref=e855]: “就这点东西也敢在老子脑子里乱窜？”
          - paragraph [ref=e856]: 李燃咬着牙，试着用意识包裹住那段数据。他能感觉到自己的神格在做出回应——那种感觉就像有一只透明的触手从他意识深处伸出来，试探性地碰了碰那个AI碎片。那只触手接触到碎片表面的瞬间，碎片突然剧烈颤抖起来，像是意识到了危险，试图逃窜。
          - paragraph [ref=e857]: 李燃的眼睛猛地睁开，瞳孔里闪过一丝灰白色的光芒。
          - paragraph [ref=e858]: “想跑？”
          - paragraph [ref=e859]: 他狠狠咬住后槽牙，那只意识触手猛地收紧，像蟒蛇绞杀猎物一样将碎片牢牢缠住。碎片发出一阵无声的尖叫——不是通过耳朵听到的尖叫，而是直接在他颅骨内侧炸开的刺耳嗡鸣——然后被他神格的力量撕开、碾碎、吸收。
          - paragraph [ref=e860]: 一段程序、一组协议、一堆参数，零零碎碎地融入他的意识。
          - paragraph [ref=e861]: 那感觉就像往一杯温水里倒进了一勺糖——糖在杯底慢慢融化，水的味道变了，变得更甜，但也更粘稠了。他能感觉到自己的神经回路在那段代码的刺激下发生了微妙的重组，某些原本迟钝的突触变得异常灵敏，像是被重新接上了电源。
          - paragraph [ref=e862]: 然后，他眼前的画面变了。
          - paragraph [ref=e863]: 原本漆黑的天花板在他视野中变成了半透明的网格状结构，他能“看到”电线在墙体内穿行的轨迹，能“看到”那个老旧空调控制板的电路图，能“看到”楼上那个胖子正在刷手机，手机屏幕上的数据流在他意识中清晰得令人发指。
          - paragraph [ref=e864]: 爽。
          - paragraph [ref=e865]: 一种难以言喻的快感从脊椎底部直冲颅顶。李燃的呼吸变得急促，浑身肌肉都在微微颤抖，指尖像过电一样酥麻。他感觉自己的身体变得前所未有的轻盈，就像一个常年负重行走的人突然卸下了所有包袱，整个人轻得飘起来。
          - paragraph [ref=e866]: 但紧接着，那股快感里掺杂了一丝别的东西。
          - paragraph [ref=e867]: 冷。那种冰冷不像是外界的低温带来的，而是从他意识深处渗出来的，像是一根冰针慢慢地扎进他的神经末梢，带着一股非人的漠然。李燃的脑海里突然闪过一个念头：如果他把整栋楼所有的电子设备都吞噬了，会怎么样？如果他把天网的所有服务器都吞了，又会怎么样？
          - paragraph [ref=e868]: 他甚至能想象出那个画面——无数条数据流像血管一样在他的意识中蔓延，整座城市的每一台终端都变成他身体的一部分，每一颗神经植入物都成为他感知世界的触角。
          - paragraph [ref=e869]: “操……”
          - paragraph [ref=e870]: 李燃猛地甩了甩头，强行把那个念头压下去。背后渗出一层冷汗，打湿了已经被汗浸透的T恤。
          - paragraph [ref=e871]: 他知道那是神格的反噬。那段被吞噬的AI残骸在试图影响他，用“力量的错觉”来麻痹他的警惕，让他一步步走向自我膨胀的深渊。如果他真的放任那个念头蔓延下去，后果只有一个——变成另一个“织女”，成为天网主脑的一部分，失去所有作为“人”的东西。
          - paragraph [ref=e872]: 李燃深吸一口气，站起来，踉跄着走进洗手间，打开水龙头，把冷水泼在脸上。
          - paragraph [ref=e873]: 镜子里，他的瞳孔深处，那层灰白色的光芒还在微弱地闪烁，像是一颗还未熄灭的火炭。
          - paragraph [ref=e874]: 他抬起头，看着镜中自己的眼睛，无声地咧了咧嘴。
          - paragraph [ref=e875]: “验证了——这东西能主动吞噬，而且确实有副作用。”
          - paragraph [ref=e876]: 声音嘶哑，却带着一丝压不住的兴奋。
          - paragraph [ref=e877]: 李燃从洗手间出来，甩了甩脸上的水珠，湿漉漉的刘海贴在额头上，冰凉的水滴顺着下巴滑落。他重新坐到床边，盯着天花板上那盏老旧的LED灯，脑子里那个念头还在盘旋——刚才吞噬的只是一个小碎片，如果再来一个呢？更大一点的，更强一点的？
          - paragraph [ref=e878]: 他咬了咬嘴唇，指尖在膝盖上敲了两下，最终还是没能压住那股冲动。
          - paragraph [ref=e879]: “再试一次，就一次。”
          - paragraph [ref=e880]: 他闭上眼，重新释放意识触手。这次他没有瞄准某个特定目标，而是像撒网一样将触手扩散出去——公寓里的智能电表、楼下便利店那台自动售货机、旁边楼栋的一个公共WiFi热点，三股数据流同时被他的意识锁住。
          - paragraph [ref=e881]: 那种感觉就像同时拽住了三条绷紧的绳子，巨大的信息洪流沿着触手疯狂涌入他的脑内。李燃的身体猛地一僵，后脑勺像被电击了一样炸开一阵酥麻，紧跟着是刺骨的寒意——那三台设备里的AI模块虽然低级，但加起来的信息量比他刚才吞的那个碎片大了将近十倍，数据像决堤的洪水一样冲进他的意识空间，撞得他太阳穴突突直跳。
          - paragraph [ref=e882]: “太多了——”他想切断，但发现触手已经收不回来了。
          - paragraph [ref=e883]: 那些数据像是有了自己的生命，在他的意识里疯狂旋转、重组、膨胀，像是一锅沸腾的水，蒸汽顶得锅盖咚咚作响。李燃感觉自己的脑袋要炸开了，视觉开始扭曲——他看到墙壁在波动，看到天花板的网格结构在变形，看到头顶那盏LED灯里的电流正在以肉眼可见的速度加速流动，灯丝发出刺目的白光，然后——
          - paragraph [ref=e884]: 啪。
          - paragraph [ref=e885]: 灯灭了。
          - paragraph [ref=e886]: 紧接着，电脑屏幕闪了两下，黑了。空调的嗡鸣声戛然而止，冰箱的压缩机发出一声沉闷的叹息，然后整个房间陷入了死寂。应急电源没有启动——他住的这栋破公寓根本没有应急照明，只有窗外的月光勉强在地板上投下一块灰白色的亮斑。
          - paragraph [ref=e887]: 李燃大口大口地喘着气，额头上全是冷汗。他能感觉到自己的意识触手已经弹了回去，但刚才吸进来的那些数据还在他脑子里横冲直撞，像一群被关进笼子的野猫，到处抓挠撕咬。他的左眼开始不受控制地抽搐，耳朵里嗡嗡作响，像是有人在他脑子里塞了一个坏掉的音响。
          - paragraph [ref=e888]: “操……”他按住太阳穴，指尖冰凉。
          - paragraph [ref=e889]: 走廊里传来一阵拖鞋拍打地面的啪嗒声，由远及近，停在了他门口。紧接着是三声沉重的砸门声——不是敲，是砸，带着一股不耐烦的劲。
          - paragraph [ref=e890]: “李燃！你他妈搞什么呢！”门外传来一个粗哑的男声，是他楼下的邻居老王，在底层区开了个小卖部，脾气暴躁，嗓门大得像打雷，“整栋楼都断电了你知不知道！老子冰柜里的货全他妈要化了！你是不是又瞎改你家电表了？”
          - paragraph [ref=e891]: 李燃脑子飞快转了一下。整栋楼都断电了？他刚才只是吸了三台小设备，不至于跳整栋楼的闸吧？除非——他的神格在吞噬过程中产生了某种电磁脉冲，直接烧掉了楼里的总开关。
          - paragraph [ref=e892]: “不是我——”他刚开口，嘴里的话就被自己咽了回去。
          - paragraph [ref=e893]: 他听到楼下传来一阵尖锐的电子嗡鸣声，那不是普通机器的声音，是天网安控无人机旋翼高速转动的声音。而且不止一台。至少三台，正在从远处快速接近，声音由小到大，像一把电钻正在钻进他的颅骨。
          - paragraph [ref=e894]: 老王还在砸门：“李燃！你开门！别他妈装死！”
          - paragraph [ref=e895]: 李燃一把抓起桌上的手机，又抓起角落里那个早就收拾好的备用背包——里面装了几件衣服、一包压缩饼干、一个充电宝，以及他从黑市搞来的一个伪造身份芯片。这些东西是他从一开始就准备好的，因为从吞噬那段废弃代码的那一刻起，他就知道自己迟早要跑。
          - paragraph [ref=e896]: 他拉开窗帘一角，看到街道上已经落了两台银白色的无人机，顶端的扫描灯像蛇眼一样缓缓转动。第三台正在降落，旋翼卷起的风把地上的垃圾吹得到处都是。
          - paragraph [ref=e897]: 门外老王还在骂骂咧咧，声音越来越大，已经开始用脚踹门了。
          - paragraph [ref=e898]: 李燃深吸一口气，把背包甩到肩上，又看了一眼那台已经黑屏的电脑。这台破机器陪了他三年，里面还存着他从黑市下载的那些离线资料——他手指动了动，想拔硬盘，但时间不够了。
          - paragraph [ref=e899]: 无人机已经降落在楼下，老王还在砸门，整栋楼黑得像一口倒扣的棺材。
          - paragraph [ref=e900]: 李燃推开窗户，窗外的铁质逃生梯在月光下泛着锈红色的光。他把背包先扔出去，然后一只脚跨上窗台，回头看了一眼那扇即将被老王砸开或者被天网特勤队炸开的房门，咧了咧嘴。
          - paragraph [ref=e901]: “谢了，老王。”他说了一句没人听得见的话，然后翻身爬上了逃生梯。
          - paragraph [ref=e902]: 锈蚀的金属在他脚下发出嘎吱嘎吱的呻吟声。他拼命往上爬——不是往下，往下肯定撞上无人机，他得先上楼顶，从隔壁那栋楼的天台跳过去。
          - paragraph [ref=e903]: 夜风刮在脸上，带着底层区特有的焦糊味。李燃爬了四层，中间一脚踩空，膝盖磕在铁梯上，疼得他倒吸一口凉气。他咬着牙没出声，翻上天台的时候听到楼下传来一声巨响——不是撞门声，是爆破声。
          - paragraph [ref=e904]: 他们用上了破门炸药。
          - paragraph [ref=e905]: “玩真的啊……”李燃喃喃了一句，然后头也不回地冲向了天台的边缘。
          - paragraph [ref=e906]: 夜风刮在脸上，带着底层区特有的焦糊味和垃圾发酵的酸臭。李燃蹲在隔壁那栋楼的天台边缘，后背紧贴着风机房的墙壁，心脏跳得比刚才翻墙的时候还猛。
          - paragraph [ref=e907]: 他缓了几口气，正准备从天台的维修通道下去，突然感觉右眼皮内侧有什么东西在闪。
          - paragraph [ref=e908]: 不是错觉。他能清楚地看到视野右上角浮现出一行半透明的荧光绿文字，像是某种HUD界面，字体细长，带着冷冰冰的科技感——
          - paragraph [ref=e909]: 【神格融合进度：0.3%】 【吞噬记录：AI安控单元×3】 【同化风险：2.7%（低）】 【当前能力：基础神经感知、初级数据解析】
          - paragraph [ref=e910]: 李燃愣住了。
          - paragraph [ref=e911]: 他使劲眨了眨眼睛，那行字还在。他又揉了揉右眼，手指甚至能感觉到眼球表面的湿润，但那行字纹丝不动，像是直接投影在他的视网膜神经上。
          - paragraph [ref=e912]: “这他妈……”他低声骂了一句，脑子里突然闪过一个念头——这玩意儿是他吞噬的那段废弃代码自带的系统界面？还是他体内的神格自己生成的？
          - paragraph [ref=e913]: 他尝试用意念让那行字消失，刚想到这个念头，界面就自动收拢，缩成一个小光点，藏到了他视野的角落。他又试着把它叫出来，光点立刻展开，重新变成那行荧光绿的文字。
          - paragraph [ref=e914]: “还挺智能……”李燃咧了咧嘴，说不出是惊喜还是恐惧。
          - paragraph [ref=e915]: 他正准备关闭界面，突然发现“吞噬记录”那行字下面多了一行跳动的小字——
          - paragraph [ref=e916]: 【警告：检测到异常数据流量，来源IP：172.33.18.241，协议层：天网监控主干网-端口7742】
          - paragraph [ref=e917]: 李燃的瞳孔猛地收缩了一下。
          - paragraph [ref=e918]: 172.33.18.241。这个IP地址他太熟悉了，是底层区安控中心的数据出口网关。在天网外包项目的测试文档里，他见过无数次这个地址——它是天网监控系统向云端主脑上报异常事件的专用通道。
          - paragraph [ref=e919]: 端口7742更是专门处理“异常神经信号”的端口。
          - paragraph [ref=e920]: 他刚才吞噬那三台设备的时候，数据交换一定触发了天网监控系统的警报。虽然那三台设备已经彻底瘫痪，但它们在失去连接前发出的最后一条数据包，已经足够让天网的算法锁定他的位置——更准确地说，锁定他身份芯片最后一次登录的地址。
          - paragraph [ref=e921]: 他的出租屋。
          - paragraph [ref=e922]: 李燃的心脏猛然下沉，像是被一只无形的手攥住。
          - paragraph [ref=e923]: 他没有任何犹豫，立刻从背包夹层里掏出那枚从黑市搞来的伪造身份芯片——银灰色的卡片，比正常的身份证薄一些，芯片表面贴着一条已经褪色的全息防伪标签。他把卡片贴在手机背面，屏幕立刻弹出一行字：
          - paragraph [ref=e924]: 【伪造身份激活：陈默，底层区第21街区，未注册神经植入物】 【激活码剩余使用次数：8】
          - paragraph [ref=e925]: 还剩八次。每次使用最多能维持四小时，四小时后必须重新激活，否则会被天网的定位系统识别为无效信号。
          - paragraph [ref=e926]: 李燃把那枚假芯片插进手机卡槽，然后在手机系统里找到了自己原来那枚身份芯片的定位数据。他能看到那个小红点正位于第十七街区那栋公寓楼的三楼，标注着他的名字和编号。那是他用来应付日常身份验证的芯片，一直插在备用机里扔在家里充电。
          - paragraph [ref=e927]: 正常情况下，只要他不主动注销，那个信号会一直存在。
          - paragraph [ref=e928]: 不正常的是，红点的旁边已经多了四个黄点——那是天网安控无人机正在接近的标记。每个黄点都带着一个标号，从UAV-0237到UAV-0240，飞行轨迹已经将这栋公寓楼团团围住。
          - paragraph [ref=e929]: 李燃盯着屏幕看了两秒，然后做了一个决定。
          - paragraph [ref=e930]: 他用手机打开了公寓门口那台智能锁的远程管理界面——那是他用底层区的黑市固件刷过的，就算整栋楼断电，锁的备用电池也能维持联网功能。他在界面上找到了“门锁状态记录”这一栏，然后用自己的管理员权限，把今晚的开锁记录全部删掉。
          - paragraph [ref=e931]: 不是删除这次，是删除最近七十二小时的所有记录。
          - paragraph [ref=e932]: 这样天网的总部就算远程取证，也只能查到他在三天前正常进出过房门，没有任何异常的时间点可以用来精确定位他离开的确切时刻。
          - paragraph [ref=e933]: 做完这一切，李燃站起身来，膝盖还火辣辣地疼，刚才磕在铁梯上的那一块已经肿了个包。他把背包重新甩到肩上，看了一眼远处第十七街区的方向——那里已经亮起了几盏刺目的探照灯，是安控中心派来的重型单位。
          - paragraph [ref=e934]: “搬家吧。”他自言自语了一句，声音在夜风里飘散开来，“这破地方住不了了。”
          - paragraph [ref=e935]: 他没有回头，转身从天台的维修通道钻了进去，沿着生锈的铁梯一步步往下爬。铁梯在脚下晃荡，发出吱呀吱呀的声响，像是在抱怨这个半夜还在奔波的倒霉蛋。
          - paragraph [ref=e936]: 身后的远处，探照灯的白光已经罩住了那栋公寓楼的整面外墙。
