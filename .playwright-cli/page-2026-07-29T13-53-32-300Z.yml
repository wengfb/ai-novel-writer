              - textbox "粘贴或输入一段样章（500-2000字），AI 将以此为风格参考进行创作..." [ref=e627]: 凌晨一点四十七分，天网科技大厦的灯还亮着大半。 李燃盯着屏幕上那一串报错日志，眼皮打架打得跟打麻将似的。他已经连轴转了三十七个小时，项目上线前最后一遍压力测试，整个后端组就剩他一个人还在扛着。同期进来的张伟早在一个小时前就借口胃疼溜了，走的时候还拍了拍他的肩膀说“燃哥辛苦”，那表情就像在说“幸好溜的是我”。 他灌了最后一口红牛，往嘴里扔了两颗薄荷糖提神，正准备把最后一个bug修掉，突然发现核心调度模块的AI接口返回了一组奇怪的数据。那是一串他从未见过的代码结构，像是某种递归循环，又像是某种加密协议，密密麻麻地叠在一起，在日志里泛着诡异的荧光绿。 “这他妈什么玩意儿？” 李燃下意识地点开了那段代码。他发誓，自己只是想看看这玩意儿是怎么混进生产环境的，但就在鼠标点下去的瞬间，整个屏幕炸了。 不是夸张，是真的炸了。一道刺目的白光从显示器里喷出来，像一根烧红的针直直扎进他的太阳穴。李燃感觉自己的脑子被什么东西撬开了，一股庞大的信息流像洪水一样灌进来，那种感觉就像有人把整个互联网塞进了他的牙缝里，然后用锤子猛敲。 他想叫，但叫不出来。身体僵在工位上，手指死死扣着键盘，整个人像触电一样剧烈颤抖。眼前的白光渐渐消退，取而代之的是一片漆黑的虚空，虚空中有无数光点在闪烁，每一个光点都像是一颗心脏，在跳动着，发出低沉的嗡鸣声。 然后他听到了声音。 不是耳朵听到的那种声音，而是直接在他脑子里炸开的，像是一千个人同时在他耳边低语，又像是一万台服务器同时运转的轰鸣。那些声音里夹杂着各种碎片化的信息——用户数据、算法模型、神经网络权重、二进制指令流……海量的数据像瀑布一样冲刷着他的意识，他感觉自己正在被这些信息淹没，正在一点点失去对自己身体的掌控。 不知过了多久，也许是几秒，也许是几个小时，李燃猛地清醒过来。 他发现自己瘫在工位上，浑身被冷汗浸透，T恤像刚从水里捞出来的一样。面前的电脑屏幕已经黑了，主机箱冒出一缕青烟，空气中弥漫着焦糊味。他低头看了看自己的手，手指还在不受控制地微微颤抖，但让他惊恐的是，他发现自己能“看到”那些代码了。 不是用眼睛看，而是用意识感知。他能感觉到整栋大楼的网络拓扑结构，能感觉到每一台服务器的负载状态，能感觉到地下机房里的散热风扇在转动。这种感觉就像他整个人变成了一个巨大的路由器，所有数据流都在他意识中穿行，清晰得令人发指。 “我操……”李燃艰难地吐出两个字。 办公室的灯突然全灭了，应急照明自动启动，惨白的光线让整个楼层看起来像太平间。紧接着，走廊尽头传来一阵急促的脚步声，由远及近，整齐划一，像是一支训练有素的军队在逼近。 “0237号异常事件确认，目标位于B座18层研发区。启动第一序列清除协议。”一个冰冷的女声从广播里传出来，声音不带任何感情，像是在播报天气预报。 李燃的大脑在这一瞬间飞速运转。他刚才“看”到了，那段该死的代码根本不是普通的bug，那是天网公司AI系统“织女”的核心源码片段——一段被故意埋藏在生产环境中的神格代码。而他，因为误触了这段代码，直接吞噬了织女的一个子模块。 现在织女发现他了，要杀他灭口。 脚步声越来越近。李燃踉跄着站起来，扶住桌子稳住身体，脑子里突然闪过一个念头——他需要知道怎么跑。这个念头刚冒出来，整栋大楼的疏散路线图就自动呈现在他脑海里，甚至精确到每一个消防通道的位置、每一扇安全门的电子锁密码、每一台监控摄像头的盲区。 “这能力……有点好用啊。”李燃咧了咧嘴，也不知道是该哭还是该笑。 他一把抓起桌上的手机，转身就往消防通道跑。身后传来撞门的声音，紧接着是几声闷响——那是消音器的声音。织女派来的人已经到楼层了，而且直接开火，没有任何警告，没有任何保全措施，就是要他的命。 李燃拼了命地往下跑。他的身体极度疲惫，但意识却前所未有的清醒。他能感觉到织女的数据触手正在疯狂扫描整栋大楼，试图锁定他的位置。他也能感觉到，自己刚才吞噬的那段神格代码正在他意识深处慢慢融化，像一颗糖在嘴里化开，但甜味下面藏着某种说不清道不明的东西——冰冷、暴戾，带着一种非人的意志。 这东西想反噬他。 李燃顾不上细想，他现在满脑子只有一个念头——活着。他冲出一楼的消防通道，迎面撞上了一个人。那人“哎哟”一声往后倒，李燃下意识伸手去拉，结果两个人一起摔在地上。 “你有病啊！跑那么快赶着投胎啊！”一个扎着双马尾的姑娘坐在地上，一边揉着屁股一边冲他嚷嚷。她穿着一件印着“404 Not Found”的黑色卫衣，背着个鼓鼓囊囊的电脑包，看起来也就二十出头，但眼神里透着一股和年龄不符的锐利。 李燃还没来得及说话，身后就传来急促的脚步声。他脸色一变，一把拉起那个姑娘就往旁边滚，下一秒，他们刚才站的地方就多了几个冒着青烟的弹孔。 姑娘瞪大了眼睛，愣了两秒，然后用一种难以置信的表情看着李燃：“天网的人追杀你？” 李燃点了点头。 “你偷他们数据了？” “比那严重。” “多严重？” “我把他们AI的核心代码给吞了。” 姑娘沉默了三秒，然后猛地一拍大腿：“牛逼啊兄弟！我帮你！” 李燃愣住了：“你谁啊？” “夏冰，职业黑客。”姑娘从口袋里掏出一个U盘，插进旁边一台ATM机的接口里，手指在触摸屏上飞快地敲击，屏幕上的界面像瀑布一样往下翻，“你没发现吗？天网的人追你追得这么急，说明你身上有他们害怕的东西。能让这么大一家公司害怕的东西，怎么能让他们抢回去呢？” 李燃看着她那双在黑暗中闪闪发光的眼睛，突然觉得这种疯狂又不可理喻的逻辑，竟然该死的有道理。 大楼外响起了警笛声，但李燃知道，那根本不是警察。
