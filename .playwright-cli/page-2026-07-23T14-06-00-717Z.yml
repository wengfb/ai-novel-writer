      - generic [ref=e146]:
        - paragraph [ref=e147]: "# 第1章 代码深渊凌晨两点十一分，底层区第十七街区的公寓楼像一具巨大的棺材，安静地杵在夜色里。李燃盯着屏幕上滚过的代码，眼睛干涩得像被砂纸打磨过。他已经在这个位置上坐了十一个小时，屁股底下那张二手人体工学椅的弹簧早就塌了，坐垫硬邦邦地硌着尾椎骨，每动一下都能听到嘎吱嘎吱的呻吟。桌上摊着三个空的红牛罐子和两包吃剩的压缩饼干，碎屑掉在键盘缝隙里，跟灰尘混在一起结成硬块。他懒得清理，反正这破键盘本来就有三个键是失灵的，R键要用吃奶的劲才能按下去，空格键有时候会卡住不回弹，他就靠屏幕右下角的虚拟键盘续命。窗外的天空灰蒙蒙的，分不清是凌晨还是傍晚。底层区的空气过滤器早就过了使用寿命，透过窗玻璃可以看到对面废弃工厂的烟囱上挂着一层厚厚的工业灰垢，像长在天空皮肤上的癣。远处偶尔传来几声低沉的机械轰鸣，那是天网公司的垃圾处理无人机在夜间作业，巨大的机械臂抓取着底层区产生的生活废物，丢进焚化炉里烧成灰烬。李燃灌了一口已经凉透的速溶咖啡，苦味顺着舌根滑进喉咙，没让他清醒多少，反而更恶心了。他在调试的是天网外包过来的一个监控模块——分布式神经信号处理节点，负责采集底层区居民的脑波数据，上传到云端做“幸福云”服务的优化。说好听点叫神经信号采集，说难听点就是给天网的意识监控网络添砖加瓦。他知道这活儿不干净，但生存点数不够用，这个月的神经植入物维护费还欠着，不接单就得断供。断供的结果他见过。上个月对面那栋楼的陈姐断了三天供，人就像被抽走了脊梁骨，走路的时候踉跄得像个提线木偶，眼睛里的光一点一点熄灭了，最后是被天网安控机器人抬走的，走的时候嘴里还在念叨着什么，声音空洞得像从井底传上来的回音。李燃甩了甩头，把这些念头赶出脑子，重新盯着屏幕。他正在检查最后一次压力测试的日志，光标在一行行数据间来回移动，突然停住了——一个异常代码段嵌在了核心逻辑层的角落里。代码结构很奇怪。像是一种被废弃的旧型号算法的遗骸，层层叠叠地包裹在一起，外层的注释已经被时间冲刷得支离破碎，只留下几行断断续续的字符——“实验体编号0237”、“神经耦合接口”、“情感剥离测试”。李燃皱了皱眉，这看起来像是天网早期AI实验的废弃代码，按理说应该早就被清理干净了，怎么还会出现在数据池里？他本能地想把这段代码删掉，指尖悬在删除键上方，却停住了。一种强烈的好奇心涌了上来，像是某种东西在推着他，让他想要看看这玩意儿里面到底藏着什么。他往下翻了几页，发现这段代码竟然还包含着完整的功能模块，虽然被废弃了，但逻辑链路竟然是通的。就像一台被扔在废弃工厂里的机器，虽然没有人在意它，但它的齿轮依然能够转动。“有意思……”李燃喃喃自语了一句。他知道不应该碰这种东西，天网外包的代码里夹带私货是常有的事，但那段代码像是有某种诱惑力，让他移不开眼睛。他的手指不受控制地在键盘上敲了几下，随手在代码末尾加了一行测试指令，想看看这个废弃模块在模拟环境下的运行状态。他承认自己就是单纯的好奇心犯了，看到一段陌生的代码就忍不住想试试它的功能，就像小孩子看到按钮就想按下去一样。他按下回车键的瞬间，整个屏幕剧烈闪烁了一下。然后，什么都没有发生。李燃盯着屏幕等了五秒，没有任何报错，也没有任何响应。他松了口气，可能是系统自动屏蔽了这个废弃模块的运行请求。他正准备继续检查下一段日志，突然感觉到一阵燥热从后脑勺蔓延开来。那种感觉不像正常的热，而像是有无数只蚂蚁在他的颅骨内侧爬动，密密麻麻地，从后脑勺一直蔓延到太阳穴，再到眼眶后面的神经丛。他的手掌开始发麻，指尖像过电一样刺痛，整个人僵在椅子上，一动也动不了。“这他妈——”话没说完，后脑勺的燥热骤然变成了灼烧。一束白光从他的视网膜深处炸开，像是有什么东西在他的大脑皮层里点燃了一把火。那把火的火焰顺着神经回路蔓延，吞噬着他的记忆，撕裂着他的意识，他的身体开始不受控制地抽搐，手指死死扣着键盘边缘，指甲嵌进塑料外壳里，发出刺耳的嘎吱声。李燃想喊救命，但喉咙像是被什么东西堵住了，只能发出含混的咕噜声。他感觉自己的大脑正在被某种外来的东西入侵，那是一股庞大的、冰冷的、非人的意识流，像是一条数据河流，蛮横地冲进他原本干净整齐的思维空间，把一切都搅得天翻地覆。他能感觉到那些代码在他脑海里复活了。它们不再是静止的字符，而是活生生的、会呼吸的东西，带着一种邪性的生命力，正在试图和他的神经元融合。那些代码像是有自己的意志，它们在他脑子里旋转、碰撞、重组，像是一个疯狂的实验室里正在进行一场暴力的化学反应。灯突然全灭了。整栋公寓楼的供电系统像是被什么东西切断了，黑暗中只有李燃的电脑屏幕还在亮着，但屏幕上的内容已经变了——不再是压力测试的日志界面，而是一片漆黑的深渊，深渊中央有一个不断旋转的光点，那光点在旋转中分裂、重组、再分裂，形成一种诡异的几何图案，像一个没有尽头的迷宫。李燃盯着那个图案，感觉自己的意识正在被吸进去，被撕碎，被重新拼接。他的太阳穴传来一阵剧烈的刺痛，像是有什么东西要从里面破壳而出。他猛地撞翻了桌上的咖啡杯，褐色的液体洒了一桌，顺着桌沿滴落在地上，发出嗒嗒的声响。他的视线开始模糊，世界的轮廓在扭曲，那台老旧空调的嗡鸣声变得异常刺耳，楼下传来的狗叫声像是在他耳边炸响。然后，他听到了别的声音。隔壁房间那个胖子在翻身，床板发出嘎吱的声响。楼上那个老太太在咳嗽，痰在喉咙里咕噜作响。楼下便利店收银机的按键声，硬币落入钱箱的叮当声。街道上那台自动贩卖机的电机声，饮料罐滚落的声音。不对。他怎么可能听到这些？李燃猛地睁开眼睛——他发现自己刚才闭上了眼，但意识却从未真正离开过。他能“看到”整栋公寓楼的网络拓扑结构，能“看到”每一根数据线在墙体内蜿蜒延伸，能“看到”楼下便利店的收银系统正在处理一笔交易，数据流像透明的丝线在他的意识中穿梭，清晰得令人头皮发麻。他低头看了看自己的手，手指还在颤抖，但掌心多了一层薄薄的光膜，泛着微弱的蓝色荧光，像是皮肤下面嵌了一排细小的LED灯。他试图让那层光膜消失，但光膜只是闪烁了两下，像是在嘲笑他的无能。“我……干了什么？”李燃的声音嘶哑得不像自己的。那段废弃代码还在他的意识深处运转着，像一颗被植入他脑中的心脏，咚咚地跳动着，每一次跳动都伴随着一阵数据洪流的冲刷。他发现自己无法将它驱逐出去，它已经和他的神经元嵌套在了一起，像是——像是它本来就应该在这里。然后，信息涌进来了。不是人类语言，不是代码，不是图像，而是某种介于三者之间的东西。那是一段算法，关于如何操控神经信号的算法。它告诉他，只要将特定频率的生物电信号输入人脑的某个特定区域，就能让人产生幻觉，看到自己最渴望的东西。然后是第二段，第三段……像是打开了一个关不上的水龙头，无数段算法、协议、架构、模型疯狂地涌入他的意识，每一段都带着一种冰冷、精确、非人的逻辑。它们在他脑子里旋转、碰撞、重组，像是被强行塞进一个容器里的液体，在寻找自己的位置。李燃的呼吸越来越急促，心跳快得像要炸开。他试图抓住某个熟悉的东西——自己的名字，自己的身份，自己昨天吃过的午饭——但那些记忆像沙子一样从指缝间流走，取而代之的是那些冰冷的算法逻辑。他想尖叫，但喉咙像是被什么东西堵住了。就在这时，他感受到了一股震动——从地板传来的，细微但规律的震动。像是有很多东西从远处接近，正在朝着这栋楼的方向移动。李燃猛地抬起头，踉跄着站起来，冲到窗边。他掀开窗帘的一角，看到街道上，三台银白色的球型安控机器人已经降落在他的公寓楼下，顶端的扫描灯像探照灯一样扫过整栋楼。更远处，六台黑色的陆行机甲正在快速接近，履带碾过柏油路，发出低沉的轰鸣声。街角的电子屏幕已经换了一行字：“0237号异常目标确认，启动清除协议。”李燃的心脏猛地收缩了一下。他松开窗帘，背靠着墙壁，呼吸急促得像刚跑完一场马拉松。那段该死的代码不仅激活了，还引发了天网主脑的注意。他现在满脑子只有一个念头：跑，立刻跑，再不跑就来不及了。但就在他准备转身的时候，那些涌进他脑子里的算法突然开始自动组合，在他意识中形成了一张三维地图——整栋公寓楼的结构、所有消防通道的位置、每一扇门的电子锁密码、每一条街道上的监控盲区。他甚至能看到那三台安控机器人的程序漏洞，就在它们的核心控制模块里，只要用特定频率的电脉冲就能让它们瘫痪。“我……该怎么用这些？”李燃喃喃自语，但那段废弃代码没有回答他。它只是在他意识深处继续运转着，像一颗等待着被发现的心脏。李燃深吸一口气，握紧拳头，转身冲向消防通道。楼下，机械履带的轰鸣声越来越近了。"
        - paragraph [ref=e568]: 李燃冲进消防通道，门在身后砰地撞上，发出沉闷的回响。
        - paragraph [ref=e569]: 楼梯间狭窄得令人窒息，墙壁上的应急灯发出惨绿色的光，把整个空间染得像泡在福尔马林里。他三步并两步往下跳，膝盖承受着冲击，疼得像被人用锤子敲打。他的呼吸急促而滚烫，每一次吸气都能闻到那股熟悉的味道——底层区特有的铁锈、霉菌和劣质消毒水混合在一起的腐臭味。
        - paragraph [ref=e570]: 意识深处的那张三维地图持续闪烁，像一盏坏掉的导航仪。他能看到三台安控机器人已经进入大楼，一台从正门进入，两台从两侧的通风管道渗透，正在沿着楼梯快速逼近。它们的运行路径在他意识中呈现为三条红色的线，像血管一样蜿蜒，正在朝着他的位置汇聚。
        - paragraph [ref=e571]: “操。”李燃咬着牙骂了一句，脚下的速度又加快了几分。
        - paragraph [ref=e572]: 七楼、六楼、五楼——他脚步带起的灰尘在应急灯光下飞舞，像一群受惊的飞蛾。他一边跑一边试图调用那套电脉冲攻击算法，但那股冰冷的代码像一条不听话的蛇，在他脑子里扭来扭去，拒绝执行他的指令。他能感受到它的存在，甚至能感受到它在嘲笑他——一个新手，一个连基础调用都做不到的废物。
        - paragraph [ref=e573]: “给老子动啊！”李燃在心里嘶吼，手指紧紧攥着楼梯扶手，金属表面冰冷的触感和掌心灼热的光膜形成强烈反差。
        - paragraph [ref=e574]: 四楼拐角处，他突然感觉到前方十米的地方有一个活动的目标——一台球型安控机器人已经绕到了消防通道的出口，正悬浮在三楼的楼梯平台上，顶端的扫描灯锁定了他。
        - paragraph [ref=e575]: 李燃本能地侧身一滚，子弹擦着他的肋骨飞过，打在身后的墙壁上，碎砖屑飞溅到他的脸上。他倒在楼梯间的平台上，后背撞到墙，疼得眼泪差点掉下来。但那一下撞击反而让他意识中的算法突然顺畅了——那条不听话的蛇找到了出口，一股清晰的指令流向他的指尖。
        - paragraph [ref=e576]: 他下意识地抬起右手，掌心对准那台机器人，一道微弱的蓝色电脉冲从光膜中射出，精准地击中了机器人核心控制模块的裂缝。
        - paragraph [ref=e577]: 那台机器人剧烈颤抖了两下，像被掐住脖子的苍蝇，指示灯狂闪，然后直直地从空中坠落，砸在水泥地上，发出一声闷响。
        - paragraph [ref=e578]: 李燃愣了半秒，然后咧嘴笑了起来，笑得很难看，像是在哭。
        - paragraph [ref=e579]: 他没时间庆祝，地图上显示另外两台机器人已经追到了五楼和四楼。他爬起来，继续往下冲。三楼的应急灯已经熄灭了，黑暗中他几乎全靠意识中的感知引导。走廊里的声控灯在他狂奔的脚步中依次亮起，像是一条为他引路的通道。
        - paragraph [ref=e580]: 终于，一楼出口的铁门出现在视野里。锈迹斑斑的门把手上挂着一把电子锁，密码面板上泛着微弱的红光。李燃的意识自动破解了密码——四位数字，应急密码，有效时间还剩十二秒。
        - paragraph [ref=e581]: 他冲过去，用颤抖的手指按下密码，电子锁发出一声清脆的咔嗒声。
        - paragraph [ref=e582]: 铁门打开的瞬间，他迎面撞上了一个人。
        - paragraph [ref=e583]: “哎哟——”一个带着怒意的声音响起，紧接着是一阵金属撞击地面的碎响。李燃和那个人一起摔在地上，他压在一个鼓鼓囊囊的电脑包上，手肘磕到地面，疼得他龇牙咧嘴。他爬起来，看到面前坐着一个姑娘，扎着双马尾，穿着一件画满像素风骷髅的黑色卫衣，脚边散落着两三块不知道从哪个设备上掉下来的电路板。她正一边揉着额头一边用一双透亮的眼睛瞪着他，那眼神里三分怒气、七分警惕。
        - paragraph [ref=e584]: “你有病啊？跑这么快赶着投胎？”姑娘拍了拍衣服上的灰，目光快速扫过李燃身后的铁门，又看了看到远处正在靠近的黑色机甲，瞳孔微缩，“天网的人在追你？”
        - paragraph [ref=e585]: 李燃点了点头，上气不接下气：“快……快走，他们……”
        - paragraph [ref=e586]: “你偷了他们的东西？”姑娘打断他，语气带着一种奇异的兴奋。
        - paragraph [ref=e587]: “比……比偷更严重。”
        - paragraph [ref=e588]: “多严重？”
        - paragraph [ref=e589]: 李燃深吸一口气，脑海中那团冰冷的算法还在跳动。他看着姑娘的眼睛，没来由地信任了她——也许是因为她眼底没有底层区常见的麻木，也许是因为他实在没有别的选择了。
        - paragraph [ref=e590]: “我把天网一段废弃AI代码给吞了。现在它在我脑子里，赶不走。”
        - paragraph [ref=e591]: 姑娘沉默了两秒，那双眼睛在李燃脸上来回扫了两遍。然后她笑起来，露出一颗小虎牙：“有意思。我叫夏冰，职业是黑天网的墙。现在，我建议我们赶紧跑，因为那六台陆行机甲三分钟后就能把这儿包成铁桶。”
        - paragraph [ref=e592]: 李燃还没来得及反应，姑娘已经弯腰捡起地上的电路板，又从口袋里掏出一个指甲盖大小的U盘，随手拍在旁边的自动售货机上。屏幕闪烁两下，整个街区的电子广告牌同时切入一段循环雪花画面。
        - paragraph [ref=e593]: “临时干扰，能拖三十秒。”夏冰一把拽起李燃的胳膊，拉着他往街对面一条狭窄的巷子里钻，“跟上，我知道怎么躲。”
        - paragraph [ref=e594]: 李燃被她拽着跑起来，脚下踩过积水坑，溅起黑色的泥点。身后传来机械臂撞击墙壁的声音和断续的电子警告音。他回头看了一眼，那六台黑色的陆行机甲已经停在公寓楼下，扫描灯像探照灯一样扫过来，光柱堪堪错过巷口。
        - paragraph [ref=e595]: 夏冰拉着他钻进巷子深处，七拐八绕，最后蹲在一台废弃的垃圾压缩机后面。两个人都喘得说不出话，汗水混着灰尘，在脸上糊成一道一道的灰痕。
        - paragraph [ref=e596]: 李燃靠在墙上，掌心那层蓝色光膜已经暗淡下去，但意识深处的算法依然在持续运转，像一台永远停不下来的引擎。
        - paragraph [ref=e597]: 夏冰看着他，眼睛亮晶晶的，声音压低却透着兴奋：“喂，你说的‘吞了AI代码’，是真的？”
        - paragraph [ref=e598]: 李燃苦笑了一下，没有说话。
        - paragraph [ref=e599]: 远处传来新的脚步声——整齐的、沉重的、金属撞击地面的声音。
        - paragraph [ref=e600]: 那是织女的人来了。
