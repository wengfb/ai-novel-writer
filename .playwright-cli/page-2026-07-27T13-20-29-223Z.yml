        - generic [ref=e805]:
          - paragraph [ref=e806]: "# 第3章 地下联络站"
          - paragraph [ref=e807]: 污水在脚下蔓延，空气中的焦糊味混着一股铁锈的腥甜，像是这座城市腐烂的肺在呼吸。夏冰拉着李燃钻过一道倒塌的铁栅栏，铁丝尖端划破了他的胳膊，疼得他倒吸一口凉气。
          - paragraph [ref=e808]: “别出声。”夏冰压低声音，手上的动作却没有停下。她弯腰从一个废弃的售票窗口下面摸出一把钥匙——不是普通的钥匙，是一根锈蚀的铜管，顶端焊着一个芯片读卡器，看起来像从某台报废终端上拆下来的零件。
          - paragraph [ref=e809]: 李燃站在她身后，一只手捂着胳膊上的伤口，视线却不由自主地扫过四周。他能“看到”这座废弃地铁站的网络拓扑残骸：老旧的监控摄像头早已断线，售票机的硬盘已经被人拆走，只剩下空壳像死去的甲虫一样瘫在墙角。但有一些东西还活着——墙体内有几根光纤依然通着微弱的光信号，像濒死患者的脉搏，跳得虚弱而固执。
          - paragraph [ref=e810]: “这地方，是安全屋？”李燃压低声音问。
          - paragraph [ref=e811]: “临时据点，不是什么豪华酒店。”夏冰把那根铜管插进售票窗口下一道几乎看不见的凹槽里，轻轻一转，地面传来一阵沉闷的机械声，“但我保证，比你家安全——至少没有安控无人机能飞进来。”
          - paragraph [ref=e812]: 地板裂开了。
          - paragraph [ref=e813]: 不是崩塌，而是两块钢板向两侧滑开，露出一道向下延伸的铁梯。铁梯很窄，只够一个人勉强通过，两侧的墙壁上覆盖着厚厚的苔藓和锈迹，空气从下方涌上来，带着一股干燥的灰尘味和电子设备特有的臭氧味。
          - paragraph [ref=e814]: 夏冰第一个爬下去，“跟上，梯子不等人。”
          - paragraph [ref=e815]: 李燃跟在她身后，每一步都踩得小心翼翼，铁梯在他脚下发出嘎吱嘎吱的呻吟，像在抱怨不该承受他的重量。他数了大概二十几阶，脚终于踩到了实地。
          - paragraph [ref=e816]: 然后灯亮了。
          - paragraph [ref=e817]: 不是日光灯，是几排缠绕在管道上的LED灯带，发出昏黄的暖光。李燃眨了好几下眼睛才适应——眼前是一个大约三十平米的圆形空间，像是废弃的地铁变电室改造而成的。四壁是裸露的水泥，地上铺着几块防潮垫，角落里摞着几个军用储物箱，一张折叠桌上摆着一台看起来像用各种零件攒出来的终端机，屏幕泛着冷淡的蓝光。
          - paragraph [ref=e818]: “我天……这地方，你一个人挖的？”李燃环顾四周，声音里带着一丝难以掩饰的惊讶。
          - paragraph [ref=e819]: “我可没那个本事。”夏冰走到那台终端机前，手指在键盘上噼里啪啦敲了几下，屏幕上弹出一串加密代码，“这是灰域的前哨站，专门用来庇护新觉醒的神格携带者。我只是知道怎么开门。”
          - paragraph [ref=e820]: “灰域？”
          - paragraph [ref=e821]: “以后再说。”夏冰转过身，看着他，眼睛在昏黄的灯光下亮得惊人，“先说说你脑子里那个东西——你感觉怎么样？有没有什么不对劲的地方？”
          - paragraph [ref=e822]: 李燃沉默了两秒。他闭上眼睛，意识中的神格界面在他视野右上方缓缓展开——【神格融合进度：0.3%】【吞噬记录：AI安控单元×3】【同化风险：2.7%（低）】。
          - paragraph [ref=e823]: 他睁开眼，看着夏冰，声音比他自己预想的要平静：“我觉得……它饿了。”
          - paragraph [ref=e824]: "---"
          - paragraph [ref=e825]: 夏冰没有立刻接话。她盯着李燃看了几秒，眼神里的玩笑色彩慢慢褪去，换上一种介于审视和担忧之间的表情。她转过身，在终端机上敲了几个键，屏幕上的加密代码瀑布般滚动了几秒，然后定格在一张复杂的数据拓扑图上。
          - paragraph [ref=e826]: “你知道我刚才为什么要带你来这儿？”夏冰的声音比刚才低了一些，像隔着一层绒布说话。
          - paragraph [ref=e827]: 李燃摇了摇头，拖着一条腿挪到折叠桌旁边的铁皮柜上坐下。胳膊上的伤口又开始渗血，但他懒得管了，反正血流量不像是动脉破裂，最多留个疤。
          - paragraph [ref=e828]: “因为我需要确认你是不是真的觉醒了。”夏冰指了指屏幕上那张拓扑图，高亮标注的部分在灯光下闪烁，像一群不安的萤火虫，“神格携带者觉醒后，周围一定半径内的电子设备上会留下量子残留痕迹。我刚才把你带到这间主控室的时候，顺路激活了沿途所有的信号检测仪。”
          - paragraph [ref=e829]: 她顿了顿，手指在键盘上敲了两下，屏幕上弹出一个新的窗口——一条波形图，上面布满了异常尖锐的峰值，像心电图上的室颤。
          - paragraph [ref=e830]: “看清楚了。这些是你经过时留下的量子信号强度。正常人的脑电波在这儿，”夏冰指了指一条几乎水平的绿色基线，“你的在这儿，”她指了指那些几乎冲破表格的红色尖峰，“差别就像荧光棒和恒星，不是一个量级。”
          - paragraph [ref=e831]: 李燃看着那条波形图，喉咙干涩得说不出话来。他低头看了看自己的手，掌心里的光膜已经暗淡到几乎看不见了，但意识深处那股温热感依然存在，像是有一只野兽蜷缩在他的脑子里，正闭着眼睛假寐。
          - paragraph [ref=e832]: “所以……我现在算什么？”他问。
          - paragraph [ref=e833]: “算个麻烦。”夏冰毫不客气地回答，但她嘴上这么说，眼神里却没有恶意，“大麻烦。天网已经盯上你了，这意味着你没机会再过普通人的生活了。你得跑，得藏，得学会控制和利用你脑子里的那玩意儿。”
          - paragraph [ref=e834]: 她说着从储物箱里翻出一卷绷带和一瓶消毒喷剂，扔到李燃怀里：“先把伤口处理一下，我不想你感染死在我的据点上，那会让我很难跟灰域交代。”
          - paragraph [ref=e835]: 李燃接住绷带，拧开消毒喷剂的盖子，往伤口上喷了两下。酒精的刺痛让他倒吸一口凉气，但他咬着牙没喊出声，只是额角的青筋跳了两下。
          - paragraph [ref=e836]: “好了。”他把用剩下的绷带卷放回桌上，声音有点哑，“现在能说说正事了吗？我需要知道——天网到底想干什么？”
          - paragraph [ref=e837]: 夏冰沉默了几秒，然后她关掉了终端机上的拓扑图，打开了一个新页面。那是一个加密文件库，文件名全都是一串十六进制编码，按照日期排列，最早的一条标注着十七年前的日期。
          - paragraph [ref=e838]: “我知道你是做天网外包的，接触过他们的监控模块。”夏冰说着，手指在键盘上飞快地敲击，“但你有没有想过，天网为什么要免费给底层区的人安装神经植入物？为什么‘幸福云’服务不需要任何付费，只要你每天醒来后允许系统采集你的脑波数据就够了？”
          - paragraph [ref=e839]: 李燃皱了皱眉：“因为……他们要用数据训练AI？”
          - paragraph [ref=e840]: “对了一半。”夏冰转过身，看着李燃的眼睛，“他们确实在用数据训练AI，但不是普通的AI。天网正在尝试构建一个覆盖全人类意识的主脑——一个能够同时接入数十亿人脑神经网络，实时读取、分析、甚至改写人类思维的系统。”
          - paragraph [ref=e841]: 她顿了一下，声音放低了一些，像是接下来要说的话连她自己都觉得荒谬：“那个系统叫做‘新世界’，而核心驱动引擎——就是神格。”
          - paragraph [ref=e842]: 李燃愣住了。他脑子里那些冰凉的算法在这一瞬间突然变得滚烫，像被点燃的燃料，烧得他的太阳穴突突直跳。
          - paragraph [ref=e843]: “可是……神格不是被他们回收的吗？”他的声音有点发紧，“我听说天网一直在秘密回收神格携带者，怎么会用它来驱动核心引擎？”
          - paragraph [ref=e844]: “回收是真的，但他们回收神格不是为了封存——是为了复制。”夏冰说着打开了一个文件，屏幕上弹出一份实验记录的截图，“你是不是觉得自己很独特？第一个觉醒的人？”
          - paragraph [ref=e845]: 夏冰笑了一下，但那笑容里没有多少轻松：“你不是第一个。在你之前至少还有二十七个，大部分被天网捕获了，被提取了神格，被用来做‘嫁接实验’。他们把同一个神格的碎片植入到不同被试者体内，观察它会如何适应不同的神经网络。”
          - paragraph [ref=e846]: 她说到这儿停顿了一秒：“实验结果吗？大部分被试者在七天内就会死于神经免疫排斥——脑组织像被开水烫过一样，神经元大面积坏死。只有一个活了下来，但那人的意识和原始人格已经完全被神格覆盖，变成了一个空壳——一个被神格控制的人偶。”
          - paragraph [ref=e847]: 李燃感觉自己的后背爬上了一层鸡皮疙瘩。他想起夏冰说“那个系统叫做新世界”的时候放低了声音，想起她说“天网正在尝试构建一个覆盖全人类意识的主脑”，想起她说那个主脑的核心是神格——这意味着每一个觉醒者的存在，都只是这个计划的一部分，只是一个用来完善技术的实验品。
          - paragraph [ref=e848]: “所以天网一直没有放弃这个计划？”李燃的声音里带着一丝不易察觉的颤抖，“只要我还在跑，他们就还有实验材料？”
          - paragraph [ref=e849]: “不是‘只要他们还在跑’，”夏冰纠正了他，语气里没有一丝开玩笑的意思，“是你。你现在的融合进度才0.3%，已经能引发这么大的动静了。如果天网的分析模型准确——”她指了指屏幕上那张波形图，“当你的融合进度超过10%时，你将能够直接接入底层区所有的公共设备网络。超过百分之二十时，你能读取方圆五公里内任何一台终端的任何数据。超过百分之五十——”
          - paragraph [ref=e850]: 她没有把话说完，但李燃从她的眼神里读到了答案：那时候的他已经不再是“人类”了，至少不是他自己了。
          - paragraph [ref=e851]: “那你们——灰域，”李燃用力攥了攥拳头，让指甲攥进掌心的疼痛盖过脑子里那些算法带来的冰冷感，“你们帮我的目的是什么？”
          - paragraph [ref=e852]: 夏冰盯着他看了几秒，然后轻轻叹了口气：“因为我们需要一个能够活着达到百分之五十融合进度的人类。”
          - paragraph [ref=e853]: 她说这句话的时候，眼底有一层微光在晃动，像一片落到水面的叶子，浮在静止的水面上，等待着被什么力量推向未知的方向。
          - paragraph [ref=e854]: 李燃沉默了很久。
          - paragraph [ref=e855]: 终端机屏幕的光在他脸上投下斑驳的阴影，他的瞳孔深处，那层灰白色的光芒还在微弱地闪烁。
          - paragraph [ref=e856]: “你刚才说，”他开口了，声音很低，“大部分被试失败了，只有一个人活了下来，变成了空壳。那个人现在在哪？”
          - paragraph [ref=e857]: 夏冰转过头去看着屏幕，过了好一会儿才回答：“就在天网总部的核心服务器里，被用作新世界系统的第一个节点——也是整个系统的中枢神经。”
          - paragraph [ref=e858]: 她说完这句话，主控室里安静得能听到LED灯带内电流流动的细碎嗡鸣声。
          - paragraph [ref=e859]: 远处的通风管道里传来一阵低沉的震动声，像是这座城市深处的心脏正在缓慢而沉重地跳动着。
          - paragraph [ref=e860]: "---"
          - paragraph [ref=e861]: 主控室的LED灯带发出均匀的冷白光，照得整间屋子像一间无菌手术室。
          - paragraph [ref=e862]: 李燃坐在那台旧终端机前，手指悬在键盘上方，没有敲下去。他脑子里还在反复回放夏冰刚才那句话——“就在天网总部的核心服务器里”——那像一根针扎在他的太阳穴里，不疼，但让他整个人都不好了。
          - paragraph [ref=e863]: 他用力搓了一把脸，掌心的蓝色光膜已经彻底消失了，皮肤恢复了正常的温度。但意识深处那行荧光绿的字还在：【神格融合进度：0.3%】，后面紧跟着——【同化风险：2.7%（低）】。
          - paragraph [ref=e864]: 低。他盯着那两个字看了几秒，觉得这个“低”字像是在嘲笑他。
          - paragraph [ref=e865]: “你说的那个东西，”李燃开口，声音有些干涩，“‘淬炼神格’——到底是什么？”
          - paragraph [ref=e866]: 夏冰靠在另一张桌子上，怀里抱着那台从旧显卡坞上拆下来的散热模块，手指有一搭没一搭地摸过铝制散热片的边缘。她沉默了几秒，然后站起来，走到另一台屏幕前，在键盘上敲了几下。
          - paragraph [ref=e867]: 屏幕上出现了一组动态的三维模型——看起来像是一个神经元网络的切片扫描图，无数条荧光色的细线交织在一起，形成一个密密麻麻的球状结构。球体的中心有一团灰白色的光晕，正在缓慢地旋转，像一颗被包裹在蛛网里的心脏。
          - paragraph [ref=e868]: “这就是你的神格。”夏冰指着那团光晕说，“不是我扫描的，是刚才你给我那个界面数据的时候，我用终端反向解析出来的。在你脑海里，它是你的‘觉醒核心’；在数据层面，它是一种量子意识片段，寄生在你的神经突触里。”
          - paragraph [ref=e869]: 李燃盯着那团灰白色的光晕，它转得很慢，像是在等待什么。
          - paragraph [ref=e870]: “神格不是静止的东西，”夏冰继续说，声音比刚才低沉了一些，“它是一个活着的系统。你每吞噬一段AI残骸，它就会吸收那些数据，用来升级自己。每升一级，你能调用的能力强一档，连接的设备范围就扩大一圈。”
          - paragraph [ref=e871]: 她说到这儿顿了一下，手指在鼠标上轻轻敲了两下，三维模型旋转到一个新的角度。球状结构的外围，有几条细线正在微微发光，像是有什么东西在那些线里流动。
          - paragraph [ref=e872]: “但每一次吞噬，”夏冰的声音低了一个度，“被吞噬的AI代码里，都残留着它‘活着’时的记忆碎片。那些不是人类记忆，而是算法在长期运行中积累的‘执行偏好’——它们对特定输入的响应习惯、对某些数据的优先级排序逻辑、甚至是对‘自我保存’这个指令的执念。你把它们吞进去，这些东西就会像种子一样埋在你的意识里。”
